publiccodeYmlVersion: "0.4"
name: FPSOT diagrams specification
url: "https://github.com/fpsot-org/fpsot-spec-diagrams"
platforms:
  - web
categories:
  - it-development
developmentStatus: concept
softwareType: "standalone/other"
description:
  en:
    shortDescription: Diagram rules for FPSOT repositories.
    longDescription: >
      Rules for drawing diagrams as PlantUML code, choosing the C4 model for
      architecture, UML for structure and behavior and BPMN for business
      processes, generating data model diagrams from LinkML, writing text
      alternatives, using color, publishing SVG files and making each
      diagram in English and French.
    features:
      - Diagrams as PlantUML code
      - C4, UML 2.5.1 and BPMN 2.0.2 by purpose
      - Text alternatives and bilingual diagrams
  fr:
    shortDescription: Règles sur les diagrammes des dépôts FPSOT.
    longDescription: >
      Règles pour dessiner les diagrammes sous forme de code PlantUML,
      choisir le modèle C4 pour l'architecture, UML pour la structure et le
      comportement et BPMN pour les processus d'affaires, générer les
      diagrammes de modèles de données à partir de LinkML, rédiger les
      textes de remplacement, employer la couleur, publier des fichiers SVG
      et produire chaque diagramme en anglais et en français.
    features:
      - Diagrammes sous forme de code PlantUML
      - C4, UML 2.5.1 et BPMN 2.0.2 selon le but
      - Textes de remplacement et diagrammes bilingues
